name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned speech runtime
        uses: actions/checkout@v4
        with:
          repository: asrjs/speech-recognition
          ref: d0a6baf32a687a1b8a94c3ab36fb089c1cd8d577
          path: .asrjs-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .asrjs-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the pinned speech runtime
        run: |
          npm ci --prefix .asrjs-core
          npm run build --prefix .asrjs-core

      - name: Compute the Pages base path
        shell: bash
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "SUITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "SUITE_BASE=/${REPO}/" >> "$GITHUB_ENV"
          fi

      # The suite-root worker isolates all apps and their shared WASM assets.
      - name: Build the four apps and the portal
        env:
          ASRJS_SOURCE: source
          ASRJS_LIB_DIR: ${{ github.workspace }}/.asrjs-core
        run: node scripts/build-suite.mjs --base="$SUITE_BASE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
