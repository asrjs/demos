<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eceff2" />
    <meta name="description" content="The ASRJS speech recognition workbench: explore models, build integrations, transcribe live audio, and run benchmarks." />
    <title>ASRJS · Speech Recognition Workbench</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="suite.css" />
    <script src="suite.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="ASRJS home"><span class="brand-mark">A</span><span>ASR<span class="brand-accent">JS</span></span></a>
      <div class="topbar-right"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme"><span aria-hidden="true">◐</span><span class="theme-label">Dark mode</span></button></div>
    </header>
    <main>
      <section class="hero">
        <h1>Speech Recognition Workbench</h1>
        <a class="hero-link" href="realtime/">Try realtime <span aria-hidden="true">↗</span></a>
      </section>
      <section class="workspace-grid" aria-label="ASRJS workspaces">
        <a class="workspace-card card-realtime" href="realtime/">
          <div class="card-top"><span class="card-index">01</span><span class="card-icon" aria-hidden="true">◉</span></div>
          <div class="card-body"><h2>Try realtime</h2></div>
        </a>
        <a class="workspace-card card-showcase" href="showcase/">
          <div class="card-top"><span class="card-index">02</span><span class="card-icon" aria-hidden="true">◈</span></div>
          <div class="card-body"><h2>Transcribe a file</h2></div>
        </a>
        <a class="workspace-card card-playground" href="playground/">
          <div class="card-top"><span class="card-index">03</span><span class="card-icon" aria-hidden="true">⌘</span></div>
          <div class="card-body"><h2>Developer quickstart</h2></div>
        </a>
        <a class="workspace-card card-benchmark" href="benchmark/">
          <div class="card-top"><span class="card-index">04</span><span class="card-icon" aria-hidden="true">▥</span></div>
          <div class="card-body"><h2>Benchmark</h2></div>
        </a>
      </section>
    </main>
    <footer><span>ASRJS</span></footer>
  </body>
</html>
